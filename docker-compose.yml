services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: civis
      POSTGRES_USER: civis
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD antes de iniciar PostgreSQL}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes:
      - civis_pg:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civis"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes:
  civis_pg:
